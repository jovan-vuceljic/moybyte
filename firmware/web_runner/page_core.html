<!doctype html><html><head><meta charset=utf-8>
<!-- The Moybyte web runner's page (moycore stage 4).

     It used to be generated from a Python string, runtime/web_view_page.PAGE_CORE,
     because three transports served the same page: the device webserver's frame
     push, the host web-console tool, and this runner. The first two died in the
     2026-08 streaming sunset and the third stopped needing a replayer, so the
     page is a plain file in the build that ships it -- no indirection, and no
     browser code left in runtime/ (which is the console the boards freeze).

     What it does now: receive a finished RGB565 framebuffer from the worker,
     expand it to RGBA through a lookup table, putImageData. Everything else here
     is input (pointer, virtual pad, keyboard, soft-keyboard summon), the
     AudioWorklet PCM ring, and layout. build.sh concatenates this with
     page_tail.js (the worker transport + loader) into dist/index.html. -->

   set it): Night's ground under the gamepad's PICO-8 colours, and Day's, the
   project site's Moy Day (native/moy_ui/themes/moy.json), with its accent on
   A. Until the script runs, the browser's own scheme picks. */

--s-bg:#5f574f;--s-ink:#fff1e8}
@media (prefers-color-scheme:light){html:not([data-scheme]){--pg:#eceef3;--pg-ink:#5f6478;
--joy-bg:#ffffff;--joy-line:#cfd3dc;--th-bg:#f4f5f8;--edge:#8f94a3;--a-bg:#4c3fd6;
--a-ink:#ffffff;--b-bg:#ffffff;--b-ink:#4c3fd6;--s-bg:#ffffff;--s-ink:#15161d}}
html[data-scheme=light]{--pg:#eceef3;--pg-ink:#5f6478;--joy-bg:#ffffff;--joy-line:#cfd3dc;
--th-bg:#f4f5f8;--edge:#8f94a3;--a-bg:#4c3fd6;--a-ink:#ffffff;--b-bg:#ffffff;--b-ink:#4c3fd6;
--s-bg:#ffffff;--s-ink:#15161d}
html,body{margin:0;height:100%;background:var(--pg);color:var(--pg-ink);
font:14px ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;
align-items:center}
/* html is a centring flex column, which would size body to its widest child's
   min-content (the nowrap title) and push the document wider than the viewport. */
body{width:100%}
/* The safe area (viewport-fit=cover: a home-screen app runs under the notch
   and the home bar): the body keeps out of the insets, and room() reads them
   back from its padding. The --sa-* are the insets, a test's to set. */
:root{--sa-t:env(safe-area-inset-top,0px);--sa-r:env(safe-area-inset-right,0px);
--sa-b:env(safe-area-inset-bottom,0px);--sa-l:env(safe-area-inset-left,0px)}
body{box-sizing:border-box;padding:var(--sa-t) var(--sa-r) var(--sa-b) var(--sa-l)}
/* Full screen on an iPhone or iPad (html.iosfs, fsMark): the browser lays its
   exit strip and Close over the top of the page, so the top inset is at
   least that strip. */
html.iosfs{--sa-t:max(env(safe-area-inset-top,0px),50px)}
/* Long-press guard: HOLDING a control (a d-pad direction, A/B)
   used to start the OS text-selection -- iOS magnifier/blue highlight, Android context
   menu -- because plain user-select isn't enough there: iOS wants the -webkit- prefix +
   -webkit-touch-callout, and the page text (title/status) had no guard at all for a hold
   that drifts off a button. Touch devices only; desktop keeps normal text selection.
   #kbin stays selectable -- its caret/selection is driven programmatically (setSelectionRange)
   and must not inherit the guard. */
@media (pointer:coarse){body{-webkit-user-select:none;user-select:none;
-webkit-touch-callout:none}
#kbin,#crash{-webkit-user-select:text;user-select:text}}
/* The page never zooms: no pinch, no double tap (iOS Safari zooms on a
   double tap of A or B); the play surfaces -- the canvas, the controls and
   everything in them -- take every touch as the console's, with no
   selection, callout or tap flash on any pointer. */
html{touch-action:pan-x pan-y}
canvas,#ctl,#ctl *{touch-action:none;-webkit-user-select:none;user-select:none;
-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* Presentation scale: the OS renders at its DESIGN resolution (320x240 /
   1024x600); fit() uses the whole available viewport while the browser keeps
   nearest-neighbour sampling. Desktop users have real keyboard/pointer input,
   so the touch controls do not consume a permanent 120px-tall band there. */
canvas{image-rendering:pixelated;background:#000;border:0;
width:min(96vw,112vh);height:auto;max-width:100%;touch-action:none;cursor:default}
/* Control sizes scale with the viewport (min(px, vw)): full desktop-tablet size when the
   width allows, proportionally smaller on narrow phones -- adding the ⌨ button made the
   fixed-px row overflow a 375px iPhone 13 mini, and flex "resolved" it by squashing the
   joystick half off-screen and overlapping the circles. flex-shrink is 0 everywhere so the
   row can never squash; the sizes are tuned to fit ~360px at their vw floors. */
#ctl{display:flex;justify-content:space-between;align-items:center;gap:min(8px,1vw);
width:min(96vw,112vh);
max-width:100%;padding:12px 4px;box-sizing:border-box;touch-action:none;user-select:none;
--bb:min(72px,15vw);--sb:min(40px,9vw);--joy:min(120px,26vw)}
#joy{flex:0 0 auto;position:relative;width:var(--joy);height:var(--joy);border-radius:50%;
background:var(--joy-bg);
border:2px solid var(--joy-line)}#th{position:absolute;top:50%;left:50%;
width:calc(var(--joy)*0.43);height:calc(var(--joy)*0.43);
margin:calc(var(--joy)*-0.215) 0 0 calc(var(--joy)*-0.215);
border-radius:50%;background:var(--th-bg);border:2px solid var(--edge);
pointer-events:none}.b{flex:0 0 auto;width:var(--bb);height:var(--bb);border-radius:50%;
display:flex;
align-items:center;justify-content:center;font:700 min(26px,5.5vw) ui-monospace;
color:var(--a-ink);
background:var(--a-bg);border:2px solid var(--edge);margin-left:min(18px,2vw)}
#bb{background:var(--b-bg);color:var(--b-ink)}
#bh,#kb{background:var(--s-bg);color:var(--s-ink);width:var(--sb);height:var(--sb);
font-size:min(16px,4vw)}
.pr{background:#ffec27;color:#1d2b53}
/* The middle cluster (#42 Thread 2 rework): the soft-keyboard summon lives in the bottom
   control bar next to the burger, NEVER floating over the canvas -- the old pinned corner
   toggle sat exactly on the console's OS status zone / context-X and ate its taps. #mid is
   always shown on touch (even for touch-only carts, so HOME/exit stays reachable); only the
   joystick + A/B gate on the cart's input hint, and only they hide while typing. */
#mid{flex:1 1 0;min-width:0;display:flex;justify-content:center;align-items:center}
#mid .b{margin:0 min(9px,1.5vw)}
#ab{flex:0 0 auto;display:flex;align-items:center}
/* #kbin is the real input that gets focused -- pinned 1x1px at the viewport origin so it
   never occludes the canvas or pushes the page around; font-size 16px so iOS doesn't zoom
   the page in on focus. */
#kbin{position:fixed;top:0;left:0;width:1px;height:1px;padding:0;margin:0;border:0;
opacity:0;font-size:16px;background:transparent;color:transparent;caret-color:transparent}
/* The controls are a touch screen's: a mouse (pointer:fine) or no pointer at
   all (a keyboard alone, a headless browser) has no use for them. */
@media (pointer:fine),(pointer:none){#ctl{display:none}}
/* A touch phone in landscape (html.phl, room()): the canvas full height and
   centred, the stick in the left margin and A/B in the right one,
   sized to it (padPlace), the keyboard summon and the burger small in the
   bottom corners: the top ones are where a browser puts its own chrome (an
   iPhone's full screen strip and its Close). #ctl covers the viewport but
   takes no taps itself. */
html.phl body{justify-content:center}
html.phl #ctl{position:fixed;left:var(--sa-l);top:var(--sa-t);right:var(--sa-r);bottom:var(--sa-b);
width:auto;height:auto;padding:0;display:block;pointer-events:none;z-index:2}
html.phl #mid{display:contents}
html.phl #ab{position:absolute;right:var(--abx);top:var(--aby);width:var(--abw);
height:calc(var(--bb)*2 + 8px);display:block;pointer-events:none}
html.phl #joy{position:absolute;left:var(--jx);top:var(--jy)}
html.phl .b{position:absolute;margin:0;pointer-events:auto}
html.phl #joy{pointer-events:auto}
html.phl #ba{right:0;top:0}html.phl #bb{left:0;bottom:0}
html.phl #kb{left:6px;bottom:6px}html.phl #bh{right:6px;bottom:6px}
/* The crash itself, ON the page: a phone has no devtools to "see". Above the
   play splash (z-index 20), which a console that crashed while booting has
   left standing. */
#crash{display:none;position:relative;z-index:21;max-width:96vw;margin:0 auto 6px;
white-space:pre-wrap;word-break:break-word;text-align:left;font-size:11px;
color:#ff004d;background:#0b0f1a}

   it has not paired yet has to ask (worker.js, THE SIGN-IN). IN THE PAGE and
   never window.prompt --
   a native dialog cannot be styled, cannot be screenshotted and cannot be
   driven by the browser harness, and this is a path that has to be testable.
   z-index above the play splash (20), which is the other thing that can be up. */
#pin{position:fixed;inset:0;z-index:30;display:none;align-items:center;
justify-content:center;background:rgba(11,15,26,.94)}
#pin .card{width:min(320px,86vw);padding:20px;border-radius:8px;
background:#1d2b53;border:1px solid #29366f;text-align:center;
font:14px ui-monospace,Menlo,Consolas,monospace;color:#c2c3c7}
#pin h2{margin:0 0 6px;font-size:16px;color:#fff1e8}
#pin p{margin:0 0 14px;font-size:12px;color:#5f6f9f;line-height:1.5}
#pinm{display:block;margin:0 0 10px;font-size:12px;color:#ffa300;min-height:15px}
#pinf{width:16ch;padding:8px;text-align:center;
font:16px ui-monospace,Menlo,Consolas,monospace;color:#fff1e8;background:#0b0f1a;
border:1px solid #5f6f9f;border-radius:4px}
#pinb{margin-left:8px;padding:9px 16px;cursor:pointer;border-radius:4px;
font:14px ui-monospace,Menlo,Consolas,monospace;color:#fff1e8;background:#7e2553;
border:1px solid #c2c3c7}
#pinb:hover{background:#a03068}
/* The card while a password is set or a pairing runs: what it does, and a
   turning ring, never a prompt (the board's curve takes seconds on a C3). */
#pin.busy #pinm::before{content:"";display:inline-block;width:9px;height:9px;
margin-right:7px;vertical-align:-1px;border:2px solid #ffa300;border-right-color:transparent;
border-radius:50%;animation:pinspin .8s linear infinite}
@keyframes pinspin{to{transform:rotate(360deg)}}
/* The loading card: what the boot is doing until the console's first frame
   (ldSay, ldDone), on the console's screen (ldPlace: the canvas's middle in
   every layout), under the play splash (20), which stands until a tap. */
#ld{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:19;display:flex;
align-items:center;gap:10px;font:14px ui-monospace,Menlo,Consolas,monospace;color:#c2c3c7;
pointer-events:none;white-space:nowrap;overflow:hidden}
#ld i{width:12px;height:12px;border:2px solid #ffa300;border-right-color:transparent;
border-radius:50%;animation:pinspin .8s linear infinite}

#hud{position:fixed;top:6px;left:6px;z-index:9;display:none;padding:6px 8px;border-radius:5px;
background:rgba(11,15,26,.82);border:1px solid #1d2b53;color:#00e436;font:12px ui-monospace;
white-space:pre;pointer-events:none}</style></head><body>

<script>
// The page's colour scheme: the url's ?scheme=dark|light (the project site
// passes its visitor's, and restarts the console on a flip of its switch),
// else the browser's own. The page around the canvas and its gamepad wear it,
// and a first-run console takes its theme variant from it (moyScheme).
(function(){var q=new URLSearchParams(location.search).get("scheme");
if(q!=="dark"&&q!=="light")q=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
document.documentElement.dataset.scheme=q;})();
var FPS=30,cv=document.getElementById("cv"),cx=cv.getContext("2d"),sEl=document.getElementById("s");
cx.imageSmoothingEnabled=false;
var W=320,H=240,ready=false,assCart=undefined,img=null,rgba=null;
// #42 Thread 3: the open cart's manifest input hint (null/"buttons"/"touch"/"keyboard" list;
// null = undeclared -> show every control, today's behaviour). applyInputHint() gates the
// virtual gamepad (#ctl) on "buttons" and the soft-keyboard summon (#kb) on "keyboard".
var INPUT=null,padWanted=true,kbWanted=true;
var HUD={on:/[?&]hud=1/.test(location.search),fps:0,kb:0,el:document.getElementById("hud"),last:0,
drawn:0,w:"",pc:{n:0,ms:0,max:0,t:0},pcs:""};
if(HUD.on)HUD.el.style.display="block";
// Periodic perf LOG: one console.log line every PERF_MS. recv = frames the page
// actually presented, render = the smoothed rAF rate, then the two halves of the
// present (565->RGBA conversion and the putImageData upload) as mean/worst. The
// old device-side fields (push rate, free heap, json/socket ms, throttled
// pushes) are gone with the streaming transport -- the console is in a worker on
// this machine now, and worker.js reports its own step cost.
var PERF_MS=2000,PERF={f:0,b:0,pk:0,t:0,
// m* = worst, s*/sn = mean. mb/sb = 565->RGBA, mu/su = putImageData upload.
mb:0,sb:0,mu:0,su:0,sn:0};
function PT(){return (window.performance&&performance.now)?performance.now():Date.now();}
function plog(){var now=PT();
if(!PERF.t){PERF.t=now;return;}var dt=(now-PERF.t)/1000;if(dt<=0)return;
console.log("[moybyte] "+(assCart||"?")+" | recv "+(PERF.f/dt).toFixed(1)
+" render "+HUD.fps.toFixed(1)+" fps | PAGE rgba "+(PERF.sn?PERF.sb/PERF.sn:0).toFixed(2)
+"/"+PERF.mb.toFixed(1)+" upload "+(PERF.sn?PERF.su/PERF.sn:0).toFixed(2)
+"/"+PERF.mu.toFixed(1)+" ms mean/worst | fb "+(PERF.b/dt/1024).toFixed(0)+" KB/s");
PERF.f=0;PERF.b=0;PERF.pk=0;PERF.t=now;
PERF.mb=0;PERF.sb=0;PERF.mu=0;PERF.su=0;PERF.sn=0;}
// Audio: play the console's FINISHED PCM (no JS synth, no resampling).
// The AudioContext is made as the page loads (suspended until a gesture
// resumes it), so its rate is known before the console boots: the init
// message hands it to the worker and the console mixes at it, the MP3
// decoder resampling once, in C (web_boot.audio_rate). The page plays samples
// one for one.
// THE SINK. The worker posts each frame's samples, {p: Int16Array, at, fresh},
// straight to an AudioWorklet over a MessageChannel where the page has one (a
// secure context), else to this page, which schedules each as an
// AudioBufferSource at the end of the last (a board-served page over plain
// HTTP). Either way they are played on arrival, never with the newest-frame
// slot a frame's pixels ride, and the sink reports its counters to the worker
// -- the samples it played, which the console's pull tops up to its target
// depth from -- and to the page's state (`__moyState().sink`): got, played,
// `under` (the queue ran dry under a stream that went on: the dry samples in
// `dry`, played as silence after a 2 ms fade, never as stale audio), `gap`
// and `dup` (samples a chunk's `at` skipped or repeated) and `over` (samples
// a full ring refused), `lull` (the longest wait, in ms of the sink's own
// clock, between two chunks arriving, `lullAt` the sink's play time in s
// when it ended) and `low` (the least lead, in ms, a chunk found queued; -1
// before the second). A chunk the console marks `fresh` starts a stream
// after a silence, so the dry run and the wait before it are no underrun
// and no lull.
// ?audio=0 makes no context: the console then has no sink and sends no samples.
var AUDIO_RATE=22050,actx=null,audioOut=null,audioBlocked=false,
AUDIO_OFF=/[?&]audio=0/.test(location.search),SINK="none";
var SS={got:0,played:0,under:0,dry:0,gap:0,dup:0,over:0,lull:0,lullAt:0,low:-1},
schedNext=-1,schedEnd=0,schedGot=-1;
var AW_SRC="class MoyPCM extends AudioWorkletProcessor{"+
"constructor(){super();this.b=new Float32Array(1<<16);this.m=this.b.length-1;this.r=0;this.w=0;this.n=0;"+
"this.last=0;this.k=0;this.d=0;this.next=-1;this.q=null;this.f=0;this.fg=-1;"+
"this.s={got:0,played:0,under:0,dry:0,gap:0,dup:0,over:0,lull:0,lullAt:0,low:-1};"+
"this.port.onmessage=(e)=>{if(e.data.port){this.q=e.data.port;this.q.onmessage=(m)=>this.take(m.data);}};}"+
"take(c){var a=c.p,n=a.length,s=this.s,ms=1000/sampleRate;"+
"if(this.fg>=0&&!c.fresh){var l=Math.round((this.f-this.fg)*ms),q=Math.round(this.n*ms);"+
"if(l>s.lull){s.lull=l;s.lullAt=Math.round(s.played*ms)/1000;}if(s.low<0||q<s.low)s.low=q;}this.fg=this.f;"+
"if(this.next>=0&&c.at!==this.next){if(c.at>this.next)s.gap+=c.at-this.next;else s.dup+=this.next-c.at;}"+
"this.next=c.at+n;if(this.d>0){if(!c.fresh){s.under++;s.dry+=this.d;}this.d=0;}"+
"for(var i=0;i<n;i++){if(this.n>this.m){s.over+=n-i;break;}"+
"this.b[this.w]=a[i]/32768;this.w=(this.w+1)&this.m;this.n++;}s.got+=n;}"+
"process(ins,outs){var o=outs[0][0],s=this.s;this.f+=o.length;"+
"for(var i=0;i<o.length;i++){"+
"if(this.n>0){var v=this.b[this.r];this.r=(this.r+1)&this.m;this.n--;s.played++;o[i]=v;this.last=v;}"+
"else{this.last=Math.abs(this.last)<1e-4?0:this.last*0.9;o[i]=this.last;if(s.got>0)this.d++;}}"+
"if(++this.k>=4){this.k=0;if(this.q)this.q.postMessage(s);}return true;}}"+
"registerProcessor('moy-pcm',MoyPCM);";
function audioInit(){var AC=window.AudioContext||window.webkitAudioContext;
if(AUDIO_OFF||!AC||actx)return;try{actx=new AC();}catch(e){actx=null;return;}
AUDIO_RATE=actx.sampleRate;audioOut=actx.createGain();audioOut.connect(actx.destination);}
audioInit();
// The worker's sink, said once: a worklet's port, or this page.
function audioSink(w){if(!actx)return;
var rate=actx.sampleRate;
if(actx.audioWorklet&&window.MessageChannel&&window.URL&&window.Blob){
try{var u=URL.createObjectURL(new Blob([AW_SRC],{type:"application/javascript"}));
actx.audioWorklet.addModule(u).then(function(){
var node=new AudioWorkletNode(actx,"moy-pcm",{numberOfInputs:0,outputChannelCount:[1]});
node.connect(audioOut);var ch=new MessageChannel();
node.port.postMessage({port:ch.port1},[ch.port1]);
w.postMessage({t:"sink",port:ch.port2,rate:rate},[ch.port2]);SINK="worklet";
}).catch(function(){SINK="page";w.postMessage({t:"sink",rate:rate});});return;}catch(e){}}
SINK="page";w.postMessage({t:"sink",rate:rate});}
function ensureAudio(){if(!actx){audioInit();if(actx&&WORKER)audioSink(WORKER);}
if(actx&&actx.state==="suspended")actx.resume();}
// The page's sink: the samples it has played are those it got less those
// still scheduled.
function audioPlayed(){if(actx&&schedNext>actx.currentTime)
return SS.got-Math.round((schedNext-actx.currentTime)*AUDIO_RATE);return SS.got;}
// A frame that carried samples while the browser's autoplay policy holds the
// context: the status chip says so, and heals once a gesture resumes it.
function audioWanted(){if(!actx)return;
if(actx.state!=="running"&&!audioBlocked){audioBlocked=true;
sEl.textContent="tap screen to enable sound";sEl.style.color="#ffa300";}
else if(actx.state==="running"&&audioBlocked){audioBlocked=false;ok=false;}}
function playPCM(c){var a=c.p,n=a.length;if(!actx||n<=0)return;
if(schedEnd>0&&c.at!==schedEnd){if(c.at>schedEnd)SS.gap+=c.at-schedEnd;else SS.dup+=schedEnd-c.at;}
schedEnd=c.at+n;
var now=actx.currentTime,t=schedNext;
