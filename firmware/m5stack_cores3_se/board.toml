#  Moybyte board definition -- M5Stack CoreS3 SE with the Faces Bottom3 and the
#  Faces Gamepad3, on MAINLINE MicroPython
#  ===========================================================================
#
#  The first console board whose input is a gamepad (owner, 2026-11-26). The
#  T-Deck's tier and glass size -- 320x240 on an S3 with 8 MB of PSRAM, its
#  panel pushed down SPI2 by the shared native/moy_lcd -- so this file is the
#  T-Deck's where the T-Deck's reason holds, and says where it differs. Read
#  README.md in this directory first: the hardware, every init step and its
#  source.

[board]
name    = "m5stack_cores3_se"
chip    = "esp32s3"
ota     = "cores3"          # the board id inside a signed OTA manifest (#53)
tier    = "handheld"
tier_why = """
320x240, ONE canvas: the system surface IS the game surface, the T-Deck's tier
(its board.toml has the why), so `wm.FullscreenStackWM` and no windowed desk."""

# No [panel] block: the T-Deck's decision (its board.toml, 2026-09-06) for the
# same 320x240 glass at a near PPI (2.0" here): the chrome tap-target floor
# would cost the bar its width.

# ---------------------------------------------------------------------------

[modules]
dest = "modules"

# `modules/` is BUILD OUTPUT plus a handful of board-authored files, and
# `freeze()` in the generated manifest freezes the whole DIRECTORY -- not the
# list build.sh copied. So a shared module that stops being staged keeps being
# frozen forever on any tree that has built before. The stager PRUNES: any
# untracked `.py` in `modules/` that this file does not stage and `keep` does
# not name is deleted, loudly, at the top of every build.
prune = true
keep  = [
  # Generated later in build.sh, into the same directory.
  "carts_data.py",   # tools/gen_device_carts.py, from system_carts/
  "fonts_data.py",   # tools/make_font.py, the tier's font set
  "_ota_build.py",   # the OTA channel/version/label/board stamp (#53)
  "uitree_pages.py", # the C engine's pages compiled ahead of time (tools/uitree_compile.py --staged)
  "uitree_lua.py",   # the UI tree API's Lua layer, frozen as text (tools/uitree_lua_freeze.py)
]

[modules.shared]
source   = "runtime"
strategy = "denylist"
why = """
Stage EVERY module under runtime/ (flat; a host/ folder never stages); name the
ones that must not cross, with the reason.

The whole console stages from the first image, the T-Deck's call (its
board.toml has the why): consecutive images differ by the thing under test.

An allowlist asks "did somebody remember to add this?", so a new shared module
is invisible to a board until a human edits a shell script; a denylist asks "is
there a reason this must not cross?", which is a question with an answer someone
can check. The bug is never loud when it happens, because every consumer in this
tree is capability-gated. `tests/test_staging_closure.py` derives this board's
frozen set from THIS FILE and asserts every import of every staged module can
resolve on this target."""

# -- host-only: real code, real purpose, impossible or wrong on a board ------

# runtime/host/ never stages (tools/board_config.py HOST_ONLY_DIR): the host's
# ctypes bindings, native build and simulator glue live there. What is denied
# below is host-side code that sits beside the shared modules.

[[modules.shared.deny]]
file = "host_api.py"
kind = "host-only"
why  = """
The HOST side of the cart-API backend: FakeWifi (the recordable service
fake) and ConsoleDriver (the sim/web per-frame driver). Since
2026-08-17 make_api itself is ONE body in the shared `cart_api.py` (which DOES
stage here) and host_api merely re-exports it -- so this denial is no longer
about duplicate backends, it is about dead weight: nothing on a board
constructs a fake service or a sim driver. host_api stays deliberately
portable (the web runner freezes it for exactly those classes)."""

[[modules.shared.deny]]
file = "input.py"
kind = "host-only"
why  = """
The host's `InputState`: the host's eight names over the input table. A board
reads the kernel's table (`moy_input.kernel()`, all fifteen names), and the
scripted-input suite already learned what freezing both costs: staging
runtime/shell/input.py made it compare the host against the host."""

# -- never on a board: importing it RAISES, which reads as a missing feature --

[[modules.shared.deny]]
file = "palette.py"
kind = "never-on-a-board"
why  = """
TRIPWIRE -- this file no longer exists. `runtime/palette.py` built MOY64 with
CPython's `colorsys` at import time, which MicroPython has none of (on glass
2026-08-15 `import palette` raised ImportError, and the Appearance screen's
cart-wallpaper panel drew nothing). Deleted 2026-11-01: libmoy's `moy_data.c`
is the table, `device_canvas.PAL565`/`MOY64_RGB` its baked twins. Named so
that its return is a decision."""

[[modules.shared.deny]]
file = "canvas.py"
kind = "never-on-a-board"
why  = """
TRIPWIRE -- this file no longer exists. `runtime/canvas.py` was the pure-Python
indexed raster, deleted 2026-08-15 when the host moved onto
`device_canvas.DeviceCanvas` like every other tier. The entry stays because a
denylist tolerates naming a file that is not there, and if this name comes back
it should be by decision."""

# -- tier: real on this repo's OTHER presentation tier, wrong on this one -----

[[modules.shared.deny]]
file = "wm_windowed.py"
kind = "tier"
why  = """
The Picotron-style WINDOWED desktop (#73/#105): the desk world, WM title
strips, drag/resize, per-window layout contexts, the taskbar. It is the P4's
and the host's presentation tier. This board is 320x240 and runs
`wm.FullscreenStackWM`, so the windowed WM is not a feature it lacks -- it is a
tier it is not."""

[[modules.shared.deny]]
file = "wm_desk.py"
kind = "tier"
why  = """
The windowed WM's two halves that live in their own files: the desk root
layer (wallpaper + bar + icon column and its retained-backdrop cache) and the
`WindowChrome` mixin (title strips, grip, taskbar chips). Only `wm_windowed.py`
imports either, so with it denied above they would freeze bytes nothing
imports."""

[[modules.shared.deny]]
file = "wm_chrome.py"
kind = "tier"
why  = """
See `wm_desk.py` above: the other half of the windowed WM, imported only by
`wm_windowed.py`."""

[[modules.shared.deny]]
file = "wm_strip.py"
kind = "tier"
why  = """
See `wm_desk.py` above: a window's title strip on the engine, imported only
by `wm_chrome.py`."""

[[modules.shared.deny]]
file = "wm_strip_ui.py"
kind = "tier"
why  = """
See `wm_desk.py` above: the strip's page, imported only by `wm_strip.py`."""

[[modules.shared.deny]]
file = "desk_ui.py"
kind = "tier"
why  = """
See `wm_desk.py` above: the desk's icon column's page, imported only by
`wm_desk.py`."""

[[modules.shared.deny]]
file = "wm_parts.py"
kind = "tier"
why  = """
See `wm_desk.py` above: the windowed WM's window record, layout context and
draw-stack layers, imported only by `wm_windowed.py` and its mixins."""

[[modules.shared.deny]]
file = "wm_overlays.py"
kind = "tier"
why  = """
See `wm_desk.py` above: the windowed WM's `WindowOverlays` mixin (the popover,
pause and wash overlays), imported only by `wm_windowed.py`."""

[[modules.shared.deny]]
file = "wm_paint.py"
kind = "tier"
why  = """
See `wm_desk.py` above: the windowed WM's `WindowPaint` mixin (the window
buffers, the game's composite, the windows' draw, the shown ring), imported
only by `wm_windowed.py`."""

[[modules.shared.deny]]
file = "wm_route.py"
kind = "tier"
why  = """
See `wm_desk.py` above: the windowed WM's `WindowRoute` mixin (the keys to the
focused window, the pointer's drag, resize, strip buttons and content),
imported only by `wm_windowed.py`."""

[[modules.shared.deny]]
file = "editor_desk.py"
kind = "tier"
why  = """
The desk Editor: the maximised Editor's workspaces and panes on a DESK metric
class (`layout_base.DESK`, a declared glass of 5" or more). This board is a
handheld, so `Workstation.editor_desk` never imports it and its bytes would
freeze unused."""

# -- no consumer here yet ----------------------------------------------------

[[modules.shared.deny]]
file = "web_input.py"
kind = "no-consumer"
why  = """
The transport-neutral half of the old web view: browser event batches ->
InputState/Pointer. It survived the 2026-08 streaming sunset because the plan's
§3.4 sync/controller RPC speaks the same `{"events":[...]}` format -- but that
RPC is not built, and today the only importer is the wasm head's `web_boot.py`.
FLIP THIS the day a board grows a consumer."""

[[modules.shared.deny]]
file = "one_buffer.py"
kind = "tier"
why  = """
The one-buffer compositor: the browser's and the host's presentation tier,
one RGB565 buffer and no flush. A board's compositor is its panel's
(native/moy_glass), so nothing on a board constructs this class."""

# -- staged under another name -----------------------------------------------

[[modules.shared.rename]]
file = "font.py"
as   = "moy_font.py"
why  = """
The petme128 8x8 glyph blob (#62). It stages as `moy_font` because that is the
name `device_canvas` imports before it will use the native `moy_gfx.text`
kernel -- so device text rasterizes from the SAME bytes the host draws from,
which is what makes pixel parity a fact rather than a hope."""

# ---------------------------------------------------------------------------

[flash]
# Read by tools/board_flash.py. The T-Deck's arrangement (its board.toml has
# each why): the merged image at 0x0, otadata erased first so the bootloader
# boots the slot just written. The CoreS3's ROM loader is reached through the
# USB-Serial/JTAG's own reset, or by holding the reset button about 3 s until
# its green LED lights (README.md, "Flashing").
image          = "dist/cores3/moybyte_cores3.bin"
offset         = "0x0"
baud           = 460800
otadata_offset = "0x1d000"
otadata_size   = "0x2000"
before         = "usb_reset"

[image]
# The OTA-slot headroom this board's app image keeps; floor 0 on every board
# (owner, 2026-11-07, the T-Deck's board.toml).
headroom_floor_kib = 0

[serial]
# The SoC's own USB-Serial/JTAG: the T-Deck's rules (its board.toml has the
# why). Attach with both lines asserted, never pulse them.
dtr         = true
rts         = true
attach_only = true
usb         = "303a:1001"
# This unit's USB serial (its MAC), the owner's board of 2026-11-26.
serial_number = "DC:B4:D9:76:AB:C0"
chunk       = 768
window      = 16384

[monitor]
baud = 115200

# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# THE HARDWARE (docs/os_2026-11/hardware.md section 1): every GPIO of the chip
# in exactly one row. The pins are M5Stack's: the CoreS3 page and schematic,
# M5GFX's board data (src/board_detect/m5/generated/esp32s3_board_data.hpp,
# `cores3se`) and M5Unified's pin tables; the Faces Gamepad3's from its
# Arduino page (SDA G12, SCL G11, INT G10). README.md has the map. This S3's
# PSRAM is QUAD (8 MB, external), so G33..G37 are free pads, and the panel and
# the card take three of them.
[hardware]
chip_gpio = "esp32s3"
unused = [15, 16, 38, 39, 40, 41, 42, 45, 46, 47, 48]

[[hardware.resource]]
name = "spi2"
class = "os"
pins = {sck = 36, mosi = 37, miso = 35, tft_cs = 3, sd_cs = 4}
why = "the panel and the TF card share it, the panel's D/C on the MISO pad (native/moy_lcd's D/C ON MISO); a per-op teardown hangs the board (README.md)"

[[hardware.resource]]
name = "i2c0"
class = "os"
pins = {sda = 12, scl = 11, sys_int = 21, pad_int = 10}
why = "the internal bus: the AXP2101, the AW9523, the FT6336U, the AW88298, the ES7210, the BM8563, and the Faces Gamepad3 over the M-Bus (its IRQ on G10); the AW9523's INTN on G21"

[[hardware.resource]]
name = "speaker"
class = "os"
pins = {bck = 34, ws = 33, dout = 13, mclk = 0}
why = "the AW88298 amplifier the console's mix plays through; MCLK clocks the ES7210 beside it (native/moy_audio/moy_aud_out.c)"

[[hardware.resource]]
name = "bar"
class = "os"
pins = {data = 5}
why = "the Faces Bottom3's ten SK6812s, dark at boot (native/moy_cores3)"

[[hardware.resource]]
name = "backlight"
class = "class"
api = "brightness"
pins = []

[[hardware.resource]]
name = "battery"
class = "class"
api = "battery"
pins = []

[[hardware.resource]]
name = "mic"
class = "class"
api = "mic"
pins = {din = 14}

[[hardware.resource]]
name = "radio"
class = "class"
api = ["http", "ble"]
pins = []

[[hardware.resource]]
name = "gpio"
class = "lease"
pins = [1, 2, 6, 7, 8, 9, 17, 18, 43, 44]
why = "the Grove ports A (G1/G2), B (G8/G9) and C (G18/G17) and the M-Bus's free pads, handed to one process"

[[hardware.resource]]
name = "usb"
class = "never"
pins = [19, 20]
why = "the USB-Serial/JTAG the console, its dev channel and the flasher are reached through"

[[hardware.resource]]
name = "flash"
class = "never"
pins = [26, 27, 28, 29, 30, 31, 32]
why = "the quad flash and the quad PSRAM's select"

[native]
dest = "native/.staged"

[native.shared]
source   = "native"
why = """
The C-module twin of [modules.shared] (#161): every directory under native/
with a micropython.cmake crosses unless denied here. This board denies NOTHING:
it drives every shared module, its panel backend native/moy_lcd among them
(one body with the T-Deck's), and its own chips are native/moy_cores3 in the
board tree, which is not staged."""

[[native.shared.take]]
module = "moy_usbdisk"
why = """
USB mass storage (docs/os_2026-11/between_apps.md section 2): Settings' USB
drive switches the S3's one internal PHY from USB-Serial/JTAG to the OTG
controller, so the card is a drive on a computer and the dev channel is gone
until it is turned off, which switches back. A restart switches back first and
the image's start puts the PHY on USB-Serial/JTAG before anything prints;
the reset button held reaches the ROM loader either way. Its transfers wait for the panel's
band gaps (moy_flush's gate), the card being on the panel's SPI2. It brings
the TinyUSB device stack (moy_tusb_config.h); the internal RAM it adds is
the build's .dram0.bss to read."""

[[native.shared.take]]
module = "moy_wasm"
why = """
The WebAssembly cart tier's engine (native/moy_wasm/README.md): the
vendored WAMR runtime, AOT only, and the thread a module runs on. The tier
ships on every console board or on none, so this board takes it. Its internal
SRAM is the tighter of the two S3 floors, and the on-glass suite's wasm checks
are the gate on it. The run stack's size and placement are this board's
MOY_WASM_* settings in mpconfigboard.h, with the measurement that chose them."""

[[native.shared.take]]
module = "moy_elf"
why = """
The native tier (native/moy_elf/README.md): the vendored elf_loader, the
process model a module runs under and the OS table it calls by ordinal. A
module's text and data live in PSRAM, loaded when it runs and freed when it
ends, so what the tier costs at rest is its code in both OTA slots. The tier
ships on every console board or on none, so this board takes it."""

[[native.shared.take]]
module = "moy_play"
why = """
The kernel's Player (docs/history/kernel_cartpath_2026-10.md): the tick model, the
runtime map and the VM-free rule, and the module `moy_play`. Every console
takes it."""

[[native.shared.take]]
module = "moy_app"
why = """
The app ABI's kernel half (docs/history/kernel_appabi_2026-10.md): the grants, the
grant policy and the roles served in C, and the module `moy_app`; and the
user-files layer the files role is served over (native/moy_store/moy_ufiles.h,
the module `moy_ufiles`). Every console takes it."""

[[native.shared.take]]
module = "moy_ui"
why = """
The widget toolkit's bodies in C with style and strings as data
(docs/history/kernel_toolkit_2026-10.md), and the module `moy_ui` runtime/toolkit/ui_draw.py's face
calls. Every console takes it."""

[[native.shared.take]]
module = "moy_uitree"
why = """
The UI engine (native/moy_uitree/moy_uitree.h): a page an app's build function
describes, drawn from C through moy_ui's verbs. Every console takes it beside
moy_ui."""

[[native.shared.take]]
module = "moy_kernel"
why = """
The kernel's entry, crash record and recovery floor
(native/moy_kernel/moy_kernel.c's header): taking it is what makes the kernel own
app_main. Every console takes it; what is this board's is in mpconfigboard.h --
the panel module's four entry points the floor draws through; its input is
serial and the touch."""

[[native.shared.take]]
module = "moy_glass"
why = """
The glass's native home (docs/history/kernel_survival_2026-10.md section 3): canvas
rows, the buffer table, the pool and present. It compiles to nothing until pass
1 of sprint 3 gives it its sources; it is taken now so that pass changes no
build list. Every console takes it."""

[[native.shared.take]]
module = "moy_input"
why = """
Input's native home (docs/history/kernel_survival_2026-10.md section 4): the merged
table, its sources and the drivers below them. It compiles to nothing until
pass 2 of sprint 3 gives it its sources; every console takes it."""

[[native.shared.take]]
module = "moy_net"
why = """
The links' native home (docs/history/kernel_survival_2026-10.md section 6): WiFi, the
link, the HTTP core, the webhost, the sync RPC and the updater. It compiles to
nothing until pass 2 of sprint 3 gives it its sources; every board with a radio
takes it."""

[[native.shared.take]]
module = "moy_sh"
why = """
The terminal's C shell (native/moy_sh/README.md, docs/os_2026-11/system.md
section 1): dash, the session, the C built-ins, the board's host table and the
serial face, the dev channel's `sh` word. It answers with the VM stopped, so
it is the kernel's, and a console takes it where its image has the room. Its writable data is one word
(tests/test_moy_sh.py); a session is PSRAM, made when a face first runs."""



# ---------------------------------------------------------------------------

[modules.device]
source   = "device"
why = """
The second staging source, and the one that must STAY an allowlist -- the same
call the P4's board file makes, for the same reason.

`runtime/` is a shared tree by definition, so a denylist over it is safe: the
default answer is "yes, this crosses". `device/` is the boards' shared DEVICE
tier (repo root since the fork's deletion, 2026-08-17 -- the "shared device
tree" #161 Phase 4/5 called the right end state), and it stays an allowlist
because not every board drives every piece of it: this board has no BLE, the
P4 has no SD or I2S, and an allowlist is where that difference is written down
per board rather than discovered as a frozen module nothing imports.

Each module named below is board-agnostic by construction, with its
hardware-specific inputs passed as constructor arguments and its optional
native modules imported inside a guard.

The groups below are ordered by the BRING-UP STAGE that first needed them, and
each says which. The whole list is present from stage 2 (see the shared section
for why the module set is settled before the console runs)."""
[[modules.device.group]]
files = ["boot_shell.py"]
why = """
The boot shell's mode ladder, which `modules/moybyte_shell.py` on this board is
now three declarations over: the board's name, the modes it has, and the module
its smokes live in. It was ~20 lines written once per board and byte-identical
after normalising those three, so the ONE-STRING rule, the self-terminating
smokes and the keep-the-REPL guards now land once instead of four times."""

[[modules.device.group]]
files = ["desktop_spine.py", "wire_input.py", "wire_links.py", "cart_net.py"]
why = """
The console desktop's boot spine: ONE `build_desktop` (the boot order and the
service set every console board wires) and ONE hand-over of the console to
the kernel's frame loop. The four boards' `run_desktop`s
carried the same imports, the same frame-loop construction,
the same `ws.*` service assignments and the same hook names in fifty-four
byte-identical lines each; a board now passes its hardware -- compositor,
canvas, inputs, keyboard, store, constants -- and takes the rest.

The spine constructs each subsystem through its provider: wire_input.py (the
pointer, the keyboards' start, a BLE-keyboard input state) and wire_links.py
(the radio link, the updaters, Get Carts' network, the web console), and
cart_net.py, that network's transport, which the Zero takes too. Audio has
no provider: the kernel's moy_audio needs no construction at boot."""

[[modules.device.group]]
files = ["mem_census.py"]
why = """
The memory census the spine marks its boot steps into: inert unless the flash
root holds `/mem_census` (written by `tools/mem_census.py`), which arms the
boot trace and the import timer. The spine imports it, so every board that
takes the spine takes it."""

[[modules.device.group]]
files = ["battery.py"]
why = """
The battery's gauge (#130): here the AXP2101's own fuel gauge and charger
status (`moy_cores3.pmic`), through `battery.PmicBattery` into the console's
`battery_level` and `battery_charging`."""

[[modules.device.group]]
files = ["device_util.py", "device_canvas.py"]
why = """
The drawing backend: `DeviceCanvas` and the `_ticks_*`/`_diag_note` leaf
helpers. `device_canvas` resolves `PAL565_WIRE` to the byte-swapped `PAL565_SW`
(no `moy_dsi` here), which is what native/moy_lcd stores (`moy_lcd.BYTE_SWAP`),
the T-Deck's arrangement."""

[[modules.device.group]]
files = ["moybyte_sd.py", "bus_store.py"]
why = """
The mount lifecycle for a card that SHARES SPI2 with the panel, the T-Deck's:
`with_sd_live` attaches through `moy_sd` to the host `moy_lcd.init()` already
initialised and keeps the card resident. The attach is native/moy_sd's C from
the `spi2` row's `sd_cs`."""

[[modules.device.group]]
files = ["device_api.py", "moycore_glue.py"]
why = """
STAGE 6 (console). The cart NAMESPACE's device home: `device_api` re-exports
THE `make_api` (one body in the shared cart_api.py since 2026-08-17, so a cart
cannot mean two things on any tier) and moycore's glue -- the run's buffers
and asset texts handed to the C, the run handed to the kernel's Player
(native/moy_play), which takes its frame, pmem persisted at the #66
boundaries. The host runs the same file over runtime/host/moycore.py."""

[[modules.device.group]]
files = ["device_wifi.py"]
why = "STAGE 6. The WLAN service the console's Settings WIFI panel and the OTA check ride."


[[modules.device.group]]
files = ["device_diag.py", "moybyte_diag.py"]
why = """
The serial diagnostics (`PERF`/`HITCH`/`LOOP`/...) and the offline RAM ring
that flushes to SD."""

[[modules.device.group]]
files = ["moy_ota.py", "moy_ota_health.py"]
why = """
STAGE 6. The OTA updater (#53). Board-agnostic: its update directory is a
constructor argument and its identity comes from the generated `_ota_build.py`.
The updater itself is the kernel's (native/moy_net/moy_ota.c: the streaming
HTTP(S) client the updater and Get Carts fetch through, the signature, the
slot); moy_ota.py is its Settings face and the identity, moy_ota_health.py the
boot verdict and the rollback confirm the frame loop drives."""


[[modules.device.group]]
files = ["moy_webhost.py"]
why = """
STAGE 6. The web console's Settings contract over the kernel's webhost
(native/moy_net/moy_webhost.c: the listener, the baked bundle, the store's
pulls and the sync apply, polled with no Python), and the routes the console
answers: PLAY ON DEVICE and the firmware hand-off."""

