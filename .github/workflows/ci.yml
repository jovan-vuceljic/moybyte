name: CI

# The host tests and the portable-subset gate on every push to master or dev and
# every fork PR. A board is proven on glass by the board pass a change lands
# behind (`tools/board.py pass`), never here.

# Both branches, deliberately. `dev` is the UNTESTED branch (see the `release`
# skill, .claude/skills/release/SKILL.md), which makes it the branch that most needs the suite:
# it is the only automated gate work gets before a human decides it is ready for
# master. A red dev is information, not an embarrassment.
on:
  push:
    branches: ["master", "main", "dev"]
  pull_request:
    branches: ["master", "main", "dev"]

# A pull request's newer push cancels its older run; a branch push never is.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The suite runs as four shards a Python version, each SERIALLY: no xdist
  # here, on purpose -- a serial run is what catches a timing-sensitive pin
  # that passes under preflight's xdist. tools/ci_shard.py deals the test
  # files out by their recorded weights (tools/ci_shard_weights.json), and
  # tests/test_ci_shard.py pins that every file lands in exactly one shard
  # and that the matrix and the call below agree.
  #
  # On a pull request it runs only from a fork (owner, 2026-11-25): a branch of
  # this repository is a worker's, landed in a batch behind one preflight
  # (tools/preflight.sh, the same suite in CI's image), and the push to dev
  # runs the suite again over the batch.
  test:
    name: Python ${{ matrix.python-version }} (shard ${{ matrix.shard }}/4)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        shard: [1, 2, 3, 4]
    env:
      # Nothing in the suite needs a real display: pygame is imported lazily
      # everywhere (moybyte_sim/pygame_backend.PygameBackend.__init__,
      # runtime/host/host_app.py's PygameAudio) and every call site falls back to
      # headless/silent if init fails. `make setup` DOES install pygame now
      # (the sim extra, so a fresh clone can run the simulator), so pin the
      # dummy SDL drivers: a headless runner should never hang waiting on a
      # display/audio device if a test path pulls pygame in for real.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: make setup

      # The compiled showcase cart's host goldens (tests/test_jet_cart.py) build
      # it with wasi-sdk 24, a 119 MB download. Cached under the sha256 the
      # build pins (tools/jet_cart.py's WASI_SDK_SHA256), so a runner fetches it
      # once per pin rather than once per run; the fetch is a step of its own
      # so a cold cache is not paid inside a test.
      - name: wasi-sdk pin
        id: wasi_sdk
        run: echo "sha256=$(sed -n 's/^WASI_SDK_SHA256 = "\(.*\)"$/\1/p' tools/jet_cart.py)" >> "$GITHUB_OUTPUT"

      - name: Cache wasi-sdk
        uses: actions/cache@v4
        with:
          path: experiments/wasm_aot/toolchain/wasi-sdk
          key: wasi-sdk-${{ steps.wasi_sdk.outputs.sha256 }}

      - name: wasi-sdk for the compiled showcase cart
        run: .venv/bin/python tools/jet_cart.py --toolchain

      # The pinned AOT compilers (tools/wasm_module.py's COMPILERS, one 65 MB
      # binary under each target's name), for the checks that compile a module
      # with a console chip's own flags: tests/test_aot_symbols.py -- every
      # symbol a module calls resolves in that chip's relocation table, which
      # FAILS under CI rather than skipping without them -- and the key and
      # push tests. Cached under the pins; the fetch checks each hash.
      - name: wamrc pins
        id: wamrc
        run: |
          echo "sha256=$(grep -o '"sha256": "[0-9a-f]*"' tools/wasm_module.py | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Cache the pinned wamrc
        uses: actions/cache@v4
        with:
          path: experiments/wasm_aot/toolchain/dist
          key: wamrc-${{ steps.wamrc.outputs.sha256 }}

      - name: The pinned wamrc for the AOT checks
        run: .venv/bin/python tools/wasm_module.py compilers

      # The COMPILED-VS-COMPILED lane. tests/test_gfx_binding.py's
      # test_matches_the_native_moy_gfx drives the same ops through the host's
      # ctypes binding and through the REAL native moy_gfx under a desktop
      # MicroPython, byte for byte -- the only check in this suite where two
      # independently compiled rasters are compared. It needed a hand-built
      # binary that nothing produced, so it passed on one developer's machine
      # and silently SKIPPED on every runner; `make unix-micropython` is that
      # build, and this step is what makes the check exist here.
      #
      # Deliberately NOT cached. It is ~20s from cold on a runner (clone,
      # submodules, mpy-cross, compile), plus a second compile for the boards'
      # object model, and a cache is another thing that can
      # go stale or miss -- and a miss that silently skipped the check is the
      # exact failure being fixed. If this step ever breaks, the tests below go
      # RED rather than quiet: the parity test fails outright when `CI` is set.
      # ...built twice: the second time in the boards' object model (32-bit,
      # REPR_C), which is the only binary on which a frame's allocations read
      # as a board's (tests/test_frame_alloc.py) and which needs a 32-bit C
      # toolchain the runner does not ship.
      - name: A 32-bit C toolchain for the boards' object-model build
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends gcc-multilib

      - name: Build the desktop MicroPython with the native usermods
        run: make unix-micropython

      # tests/test_redraw_on_change.py asserts exact/zero redraw counts against
      # real wall-clock deadlines (Workstation._frames_drawn), but the top bar
      # clock legitimately repaints on a real minute rollover -- so when this
      # file's tests land inside a long multi-file pytest run there's a small
      # chance the run straddles :00 and trips an "exactly one redraw" assert.
      # It has never been observed to fail standalone (a whole-file run is
      # under 2s, so the rollover window is tiny) -- only inside a full-suite
      # run that takes long enough in wall-clock time to cross a boundary.
      # Isolating it removes the shared-run timing risk instead of chasing a
      # rerun-on-failure workaround. See the repo's redraw-test-wallclock-flake
      # note for the observed history.
      # --durations names the slowest tests in the log. The suite's runtime is
      # the thing nobody measures until it is already the reason to skip it.
      # Each shard's files (the redraw file is in none of them).
      - name: Run test suite, shard ${{ matrix.shard }} of 4
        run: |
          .venv/bin/python -m pytest --durations=25 \
            $(.venv/bin/python tools/ci_shard.py 4 ${{ matrix.shard }})

      # A pixel golden that moved left its frames under .build/goldens
      # (tests/pixel_goldens.py): render the same tests at the base, write
      # before, after and a marked diff of each, and upload the lot.
      - name: Before, after and a diff of the moved pixel goldens
        if: failure() && hashFiles('.build/goldens/**/node.txt') != ''
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          .venv/bin/python tools/golden_diff.py "$BASE" || true

      - name: Upload the moved pixel goldens
        if: failure() && hashFiles('.build/goldens/**/node.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: moved-goldens-py${{ matrix.python-version }}-shard${{ matrix.shard }}
          path: |
            .build/goldens/
            .build/golden_diff/
          if-no-files-found: ignore

      - name: Run redraw-on-change tests in isolation
        if: matrix.shard == 1
        run: .venv/bin/python -m pytest tests/test_redraw_on_change.py

      # The console itself, headless: boot the launcher, run a cart, exit. This
      # is what the .moyproj SDK's example steps used to stand in for.
      - name: Boot the console headless
        if: matrix.shard == 1
        run: .venv/bin/python tools/simulate_desktop.py --demo --gif /tmp/demo.gif --strict
